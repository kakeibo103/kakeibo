<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a8b99a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="かんたん家計簿">
<link rel="manifest" href="manifest.webmanifest">
<title>かんたん家計簿 第2号</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee8da;color:#3f463d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:600px;margin:auto;min-height:100vh;background:#f8f5ec;padding-bottom:78px}
header{background:#a8b99a;color:#fff;padding:18px 18px 15px;position:sticky;top:0;z-index:3;box-shadow:0 1px 4px #5d674b22}
h1{font-size:21px;margin:0}.sub{font-size:13px;opacity:.95;margin-top:5px}
main{padding:14px}.screen{display:none}.screen.active{display:block}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fffdf8;border-radius:15px;padding:15px;box-shadow:0 1px 5px #6d6b5a18;border:1px solid #e8e1d3}
.balance{grid-column:1/-1}.label{font-size:12px;color:#7a8175}.value{font-size:21px;font-weight:700;margin-top:5px}
.blue{color:#687f92}.red{color:#a66d68}.green{color:#6f8c6a}
h2{font-size:17px;margin:20px 2px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;background:#e8eee2;color:#63755b}
.primary{background:#a8b99a;color:#fff;width:100%;margin-top:12px}
input,select{width:100%;padding:12px;border:1px solid #d9d3c6;border-radius:10px;font-size:16px;background:#fffdf8;color:#3f463d}
label{font-size:12px;color:#687064;display:block;margin:10px 0 5px}
.item{display:flex;justify-content:space-between;gap:8px;padding:13px 0;border-bottom:1px solid #eee8dc}.item:last-child{border-bottom:0}
.meta{font-size:12px;color:#8a9085;margin-top:3px}.amount{font-weight:700;white-space:nowrap}.empty{text-align:center;color:#aaa99f;padding:25px}
.cat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee8dc;font-size:14px}
.bar{height:9px;background:#e6e2d8;border-radius:99px;margin:5px 0 9px;overflow:hidden}.fill{height:100%;background:#a8b99a}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:auto;background:#fffdf8;border-top:1px solid #ded8ca;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:10}
.nav button{border:0;background:#fffdf8;color:#8b9088;font-size:11px;padding:5px 1px}.nav button.active{color:#6f8665;font-weight:700}.nav b{display:block;font-size:19px;margin-bottom:2px}
textarea{width:100%;min-height:100px;border:1px solid #d9d3c6;border-radius:10px;padding:10px;font-family:inherit}
.small{font-size:12px;color:#7d8479}.danger{background:#f3dfdc;color:#a05d58}
.category-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #eee8dc}

/* calendar */
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calendar-title{font-size:19px;font-weight:700}
.month-btn{border:0;background:#e8eee2;color:#65775c;border-radius:10px;padding:9px 12px;font-weight:700}
.calendar-card{background:#fffdf8;border:1px solid #e8e1d3;border-radius:16px;padding:10px;box-shadow:0 1px 5px #6d6b5a18}
.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.weekdays div{text-align:center;font-size:11px;color:#92978d;padding:6px 0}
.day{min-width:0;min-height:72px;border:1px solid #eee9df;border-radius:9px;margin:2px;padding:5px;background:#fffefa;cursor:pointer}
.day.other{opacity:.42;background:#f5f1e8}
.day.today{outline:2px solid #b7c7aa}
.daynum{font-size:12px;font-weight:700}
.day.income{background:#eef3e9}.day.expense{background:#f5ebe6}
.day-balance{font-size:11px;font-weight:700;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-count{font-size:9px;color:#8a9085;margin-top:3px}
.cal-legend{display:flex;gap:12px;font-size:11px;color:#7e847a;margin-top:10px;justify-content:center}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:3px}
</style>
</head>
<body>
<div class="app">
<header><h1>かんたん家計簿</h1><div class="sub" id="headerSub"></div></header>
<main>
<section id="home" class="screen active">
<div class="summary">
<div class="card"><div class="label">今月の収入</div><div class="value green" id="income">¥0</div></div>
<div class="card"><div class="label">今月の支出</div><div class="value red" id="expense">¥0</div></div>
<div class="card balance"><div class="label">今月の残り</div><div class="value blue" id="balance">¥0</div></div>
</div>
<h2>支出の内訳</h2><div class="card" id="homeCats"></div>
<button class="btn primary" onclick="show('input')">＋ 支出を入力</button>
</section>

<section id="input" class="screen">
<h2 id="inputTitle">支出・収入を入力</h2>
<div class="card">
<label>種類</label>
<select id="type"><option value="expense">支出</option><option value="income">収入</option></select>
<label>金額</label><input id="amount" type="number" inputmode="numeric" min="1" placeholder="例：5000">
<label>カテゴリ</label><select id="category"></select>
<label>日付</label><input id="date" type="date">
<label>内容</label><input id="note" placeholder="例：スーパー">
<button class="btn primary" id="saveButton" onclick="saveItem()">保存する</button>
<button class="btn" id="cancelEdit" onclick="newItem()" style="width:100%;margin-top:8px;display:none">編集をキャンセル</button>
</div>
<h2>カテゴリ設定</h2>
<div class="card">
<div class="small">カテゴリは自由に追加・変更できます。</div>
<div class="grid" style="margin-top:8px">
<input id="newCategory" placeholder="新しいカテゴリ">
<button class="btn" onclick="addCategory()">＋追加</button>
</div>
<div id="categoryManager"></div>
</div>

<h2>データ管理</h2>
<div class="card">
<div class="small">家計簿のデータをファイルに保存できます。機種変更や万一のデータ消失に備えて、定期的にバックアップしてください。</div>
<button class="btn primary" onclick="backupData()" style="width:100%;margin-top:10px">📥 データをバックアップ</button>
<label style="margin-top:12px">バックアップから復元</label>
<input id="restoreFile" type="file" accept=".json,application/json" onchange="restoreData(event)">
<div class="small" style="margin-top:6px">※復元すると現在のデータはバックアップの内容に置き換わります。</div>
</div>
</section>

<section id="history" class="screen">
<h2>履歴</h2><div class="grid"><select id="period" onchange="render()"><option value="month">今月</option><option value="all">すべて</option></select><select id="filter" onchange="render()"><option value="all">全カテゴリ</option></select></div>
<div class="card" style="margin-top:10px" id="historyList"></div>
</section>


<section id="calendar" class="screen">
<h2>カレンダー</h2>
<div class="calendar-head">
<button class="month-btn" onclick="changeCalendarMonth(-1)">‹ 前月</button>
<div class="calendar-title" id="calendarMonthLabel"></div>
<button class="month-btn" onclick="changeCalendarMonth(1)">翌月 ›</button>
</div>
<div class="calendar-card">
<div class="weekdays"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
<div class="calendar-grid" id="calendarGrid"></div>
</div>
<div class="cal-legend">
<span><i class="legend-dot" style="background:#f0dcd5"></i>支出</span>
<span><i class="legend-dot" style="background:#dce9d5"></i>収入</span>
</div>
<div class="card" style="margin-top:10px">
<div class="label" id="calendarSummary"></div>
<div class="value" id="calendarSummaryValue">¥0</div>
</div>
</section>

<section id="assets" class="screen">
<h2>資産管理</h2>
<div class="grid">
<button type="button" class="btn" onclick="changeAssetMonth(-1)">← 前月</button>
<button type="button" class="btn" onclick="changeAssetMonth(1)">翌月 →</button>
</div>
<div class="card" style="margin-top:10px">
<div class="label" id="assetMonthLabel"></div>
<div class="value blue" id="assetTotal">¥0</div>
</div>
<div class="card" style="margin-top:10px">
<label>項目名</label><input id="assetName" placeholder="例：銀行口座">
<label>残高</label><input id="assetAmount" type="number" inputmode="numeric" placeholder="例：500000">
<button class="btn primary" onclick="saveAsset()">この月の資産を保存</button>
</div>
<h2>この月の資産</h2><div class="card" id="assetList"></div>
<h2>資産推移</h2><div class="card" id="assetTrend"></div>
</section>
</main>
<nav class="nav">
<button onclick="show('home')" data-s="home" class="active"><b>🏠</b>ホーム</button>
<button onclick="show('input')" data-s="input"><b>＋</b>入力</button>
<button onclick="show('history')" data-s="history"><b>📋</b>履歴</button>
<button onclick="show('calendar')" data-s="calendar"><b>📅</b>カレンダー</button>
<button onclick="show('assets')" data-s="assets"><b>💰</b>資産</button>
</nav>
</div>
<script>
const DATA='kakeibo_v2_data',ASSET='kakeibo_v2_assets';
const $=id=>document.getElementById(id), yen=n=>'¥'+Number(n).toLocaleString('ja-JP');
const now=new Date(), ym=now.toISOString().slice(0,7);
let data=JSON.parse(localStorage.getItem(DATA)||'[]'),assets=JSON.parse(localStorage.getItem(ASSET)||'[]');
let assetMonth=ym;
let calendarMonth=ym;
$('date').value=now.toISOString().slice(0,10);
function current(){return data.filter(x=>x.date.slice(0,7)===ym)}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.s===id));render()}

const CATKEY='kakeibo_v2_categories';
const DEFAULT_CATEGORIES=['食費','日用品','住宅','光熱費','通信費','交通費','趣味','医療','給与','その他'];
let categories=JSON.parse(localStorage.getItem(CATKEY)||JSON.stringify(DEFAULT_CATEGORIES));
let editingId=null;

function renderCategories(){
  const current=$('category').value;
  $('category').innerHTML=categories.map(c=>'<option>'+esc(c)+'</option>').join('');
  if(categories.includes(current)) $('category').value=current;
  $('categoryManager').innerHTML=categories.map((c,i)=>
    '<div class="category-row"><span>'+esc(c)+'</span>'+
    '<button class="btn" onclick="renameCategory('+i+')">変更</button>'+
    '<button class="btn danger" onclick="removeCategory('+i+')">削除</button></div>').join('');
}
function newItem(){
  editingId=null;
  $('inputTitle').textContent='支出・収入を入力';
  $('saveButton').textContent='保存する';
  $('cancelEdit').style.display='none';
  $('type').value='expense'; $('amount').value=''; $('note').value='';
  $('date').value=new Date().toISOString().slice(0,10);
  renderCategories();
}
function editItem(id){
  const x=data.find(v=>v.id===id); if(!x)return;
  editingId=id;
  $('inputTitle').textContent='記録を編集';
  $('saveButton').textContent='変更を保存';
  $('cancelEdit').style.display='block';
  $('type').value=x.type; renderCategories(); $('category').value=x.category;
  $('amount').value=x.amount; $('date').value=x.date; $('note').value=x.note||'';
  show('input');
}
function addCategory(){
  const n=$('newCategory').value.trim();
  if(!n)return alert('カテゴリ名を入力してください');
  if(categories.includes(n))return alert('同じカテゴリがあります');
  categories.push(n); localStorage.setItem(CATKEY,JSON.stringify(categories));
  $('newCategory').value=''; renderCategories();
}
function renameCategory(i){
  const old=categories[i], n=prompt('新しいカテゴリ名',old);
  if(n===null)return;
  const name=n.trim(); if(!name||name===old)return;
  if(categories.includes(name))return alert('同じカテゴリがあります');
  data.forEach(x=>{if(x.category===old)x.category=name});
  categories[i]=name;
  localStorage.setItem(CATKEY,JSON.stringify(categories));
  localStorage.setItem(DATA,JSON.stringify(data));
  render();
}
function removeCategory(i){
  if(categories.length<=1)return alert('カテゴリは1つ以上必要です');
  const n=categories[i];
  if(!confirm('「'+n+'」をカテゴリ一覧から削除しますか？'))return;
  categories.splice(i,1); localStorage.setItem(CATKEY,JSON.stringify(categories)); renderCategories();
}

function saveItem(){
  const amount=Number($('amount').value);
  if(!amount)return alert('金額を入力してください');
  const obj={type:$('type').value,amount,category:$('category').value,date:$('date').value,note:$('note').value.trim()};
  if(editingId){
    const i=data.findIndex(x=>x.id===editingId);
    if(i>=0)data[i]=Object.assign({},data[i],obj);
  }else{
    data.push(Object.assign({id:String(Date.now())},obj));
  }
  localStorage.setItem(DATA,JSON.stringify(data));
  newItem(); show('home');
}
function del(id){
  if(!confirm('この記録を削除しますか？'))return;
  data=data.filter(x=>x.id!==id); localStorage.setItem(DATA,JSON.stringify(data)); render();
}

function saveAsset(){
  const n=$('assetName').value.trim(), a=Number($('assetAmount').value);
  if(!n||!a)return alert('項目名と残高を入力してください');
  const old=assets.find(x=>x.month===assetMonth&&x.name===n);
  if(old)old.amount=a; else assets.push({id:String(Date.now()),month:assetMonth,name:n,amount:a});
  localStorage.setItem(ASSET,JSON.stringify(assets));
  $('assetName').value=''; $('assetAmount').value=''; render();
}
function editAsset(id){
  const x=assets.find(v=>v.id===id); if(!x)return;
  const n=prompt('項目名',x.name); if(n===null)return;
  const name=n.trim(); if(!name)return;
  const a=prompt('残高',String(x.amount)); if(a===null)return;
  const amount=Number(a); if(!amount)return;
  x.name=name; x.amount=amount;
  localStorage.setItem(ASSET,JSON.stringify(assets)); render();
}
function delAsset(id){
  if(!confirm('この月の資産記録を削除しますか？'))return;
  assets=assets.filter(x=>x.id!==id); localStorage.setItem(ASSET,JSON.stringify(assets)); render();
}
function changeAssetMonth(delta){
  const parts=assetMonth.split('-').map(Number);
  const d=new Date(parts[0],parts[1]-1+delta,1);
  assetMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  render();
}


function changeCalendarMonth(delta){
  const p=calendarMonth.split('-').map(Number);
  const d=new Date(p[0],p[1]-1+delta,1);
  calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  renderCalendar();
}
function renderCalendar(){
  const [y,m]=calendarMonth.split('-').map(Number);
  $('calendarMonthLabel').textContent=y+'年'+m+'月';
  const first=new Date(y,m-1,1);
  const start=new Date(y,m-1,1-first.getDay());
  let out='';
  for(let i=0;i<42;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const monthKey=ds.slice(0,7);
    const items=data.filter(x=>x.date===ds);
    const exp=items.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
    const inc=items.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
    const net=inc-exp;
    let cls='day';
    if(monthKey!==calendarMonth)cls+=' other';
    if(ds===new Date().toISOString().slice(0,10))cls+=' today';
    if(exp&&!inc)cls+=' expense';
    if(inc&&!exp)cls+=' income';
    if(exp&&inc)cls+=' expense';
    const amount=net===0?'':(net>0?'+':'-')+yen(Math.abs(net));
    out+=`<div class="${cls}" onclick="showDay('${ds}')"><div class="daynum">${d.getDate()}</div>${amount?`<div class="day-balance ${net>0?'green':net<0?'red':''}">${amount}</div>`:''}${items.length?`<div class="day-count">${items.length}件</div>`:''}</div>`;
  }
  $('calendarGrid').innerHTML=out;
  const monthItems=data.filter(x=>x.date.slice(0,7)===calendarMonth);
  const exp=monthItems.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
  const inc=monthItems.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
  $('calendarSummary').textContent=calendarMonth.replace('-','年')+'月の収支';
  $('calendarSummaryValue').textContent=(inc-exp>=0?'+':'-')+yen(Math.abs(inc-exp));
}
function showDay(ds){
  const items=data.filter(x=>x.date===ds);
  if(!items.length){ $('date').value=ds; show('input'); return; }
  const label=ds.replace(/-/g,'/');
  const lines=items.map(x=>(x.type==='income'?'+':'-')+yen(x.amount)+'　'+(x.note||x.category)).join('\n');
  alert(label+'\n\n'+lines);
}

function backupData(){
 const payload={app:"kakeibo",version:"2.3",exportedAt:new Date().toISOString(),data:data,assets:assets,categories:categories};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a"),d=new Date();
 const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
 a.href=url;a.download="kakeibo_backup_"+stamp+".json";document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function restoreData(event){
 const file=event.target.files&&event.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=function(){
  try{
   const p=JSON.parse(reader.result);
   if(!p||!Array.isArray(p.data)||!Array.isArray(p.assets))throw new Error();
   if(!confirm("現在の家計簿データを、このバックアップで置き換えます。よろしいですか？"))return;
   data=p.data;assets=p.assets;
   if(Array.isArray(p.categories)&&p.categories.length)categories=p.categories;
   localStorage.setItem(DATA,JSON.stringify(data));
   localStorage.setItem(ASSET,JSON.stringify(assets));
   localStorage.setItem(CATKEY,JSON.stringify(categories));
   renderCategories();render();renderCalendar();alert("データを復元しました。");
  }catch(e){alert("バックアップファイルを読み込めませんでした。家計簿から作成したJSONファイルを選んでください。");}
  finally{event.target.value="";}
 };
 reader.readAsText(file);
}

function render(){
 let c=current(),inc=c.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),exp=c.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
 $('headerSub').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月';
 $('income').textContent=yen(inc);$('expense').textContent=yen(exp);$('balance').textContent=yen(inc-exp);
 let cats={};c.filter(x=>x.type==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);
 let entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]);$('homeCats').innerHTML=entries.length?entries.map(([k,v])=>`<div class="cat"><span>${esc(k)}</span><b>${yen(v)}</b></div>`).join(''):'<div class="empty">まだ支出がありません</div>';
 let opts=['<option value="all">全カテゴリ</option>'];[...new Set(data.map(x=>x.category))].sort().forEach(x=>opts.push(`<option>${esc(x)}</option>`));let old=$('filter').value;$('filter').innerHTML=opts.join('');if([...$('filter').options].some(o=>o.value===old))$('filter').value=old;
 let list=data.slice().sort((a,b)=>b.date.localeCompare(a.date));if($('period').value==='month')list=list.filter(x=>x.date.slice(0,7)===ym);if($('filter').value!=='all')list=list.filter(x=>x.category===$('filter').value);
 $('historyList').innerHTML=list.length?list.map(x=>`<div class="item"><div><b>${esc(x.note||x.category)}</b><div class="meta">${x.date} ・ ${esc(x.category)}</div></div><div><span class="amount ${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'-'}${yen(x.amount)}</span><button class="btn" onclick="editItem('${x.id}')">編集</button><button class="btn danger" onclick="del('${x.id}')">削除</button></div></div>`).join(''):'<div class="empty">記録がありません</div>';
 let monthAssets=assets.filter(x=>x.month===assetMonth);
let total=monthAssets.reduce((s,x)=>s+x.amount,0);
let [ay,am]=assetMonth.split('-');$('assetMonthLabel').textContent=ay+'年'+Number(am)+'月の資産合計';$('assetTotal').textContent=yen(total);
$('assetList').innerHTML=monthAssets.length?monthAssets.map(x=>`<div class="item"><b>${esc(x.name)}</b><div><span class="amount">${yen(x.amount)}</span><button class="btn" onclick="editAsset('${x.id}')">編集</button><button class="btn danger" onclick="delAsset('${x.id}')">削除</button></div></div>`).join(''):'<div class="empty">この月の資産を登録してください</div>';
let months=[...new Set(assets.map(x=>x.month))].sort();
if(!months.includes(assetMonth)) months.push(assetMonth);
months.sort();
